---
- name: Implementing tags in ansible
  hosts: all
  tasks:
    - name: Install tomcat10
      apt:
        name: tomcat10
        state: present
        update_cache: yes
      tags:
        - tomcat_install
        - install
        - never
    - name: Install apache2
      apt:
        name: apache2
        state: present
        update_cache: yes
      tags:
        - apache2_install
        - install
    - name: Restart tomcat10
      service:
        name: tomcat10
        state: restarted
      tags:
        - tomcat_restart
        - restart
    - name: Restart apache2
      service:
        name: apache2
        state: restarted
      tags:
        - apache_restart
        - restart
...
